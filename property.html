<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매물/DB - 엘루이 업무 포털</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="page-app">
    <div class="container">
        <aside class="sidebar">
            <!-- Sidebar content -->
        </aside>
        <main class="main-content">
            <header class="main-header">
                <h1><i data-lucide="database"></i> 매물/DB</h1>
            </header>
            <div class="content">
                <div class="tab-nav">
                    <button class="tab-button active" data-tab="live-room">🔥 실시간 매물방</button>
                    <button class="tab-button" data-tab="search">🔍 전체검색</button>
                    <button class="tab-button" data-tab="building-info">🏢 건물 정보</button>
                    <button class="tab-button" data-tab="owner-search">👤 소유주검색</button>
                    <button class="tab-button" data-tab="office-call">📞 오늘의 오피콜</button>
                    <button class="tab-button" data-tab="vip-expiry" id="vip-tab">⏰ VIP만기</button>
                    <button class="tab-button" data-tab="new-registration">📝 신규 등록</button>
                </div>

                <!-- Tab 1: Live Room -->
                <div id="live-room" class="tab-content active">
                    <!-- Live room content from previous steps -->
                </div>

                <!-- Tab 2: Full Search -->
                <div id="search" class="tab-content">
                    <h2>🔍 엘루이 통합 디테일 검색</h2>
                    <div class="card">
                        <form id="search-property-form" class="form-layout">
                            <div class="grid-3">
                                <div class="form-group">
                                    <label for="s-city">시/도</label>
                                    <select id="s-city" name="s_city"></select>
                                </div>
                                <div class="form-group">
                                    <label for="s-gu">시/군/구</label>
                                    <select id="s-gu" name="s_gu"></select>
                                </div>
                                <div class="form-group">
                                    <label for="s-dong">법정동</label>
                                    <select id="s-dong" name="s_dong"></select>
                                </div>
                            </div>
                            <div class="grid-2">
                                <div class="form-group">
                                    <label for="s-bldg">번지/건물명</label>
                                    <input type="text" id="s-bldg" name="b_search" placeholder="28-2 또는 엘루이">
                                </div>
                                <div class="form-group">
                                    <label for="s-room">호실</label>
                                    <input type="text" id="s-room" name="r_search" placeholder="101">
                                </div>
                            </div>
                            <hr>
                            <label><strong>💰 금액 필터 (단위: 만원)</strong></label>
                            <div class="grid-4">
                                <div class="form-group">
                                    <label for="min-dep">최소 보증금</label>
                                    <input type="number" id="min-dep" name="min_dep" value="0">
                                </div>
                                <div class="form-group">
                                    <label for="max-dep">최대 보증금</label>
                                    <input type="number" id="max-dep" name="max_dep" value="999999">
                                </div>
                                <div class="form-group">
                                    <label for="min-rent">최소 월세</label>
                                    <input type="number" id="min-rent" name="min_rent" value="0">
                                </div>
                                <div class="form-group">
                                    <label for="max-rent">최대 월세</label>
                                    <input type="number" id="max-rent" name="max_rent" value="9999">
                                </div>
                            </div>
                            <hr>
                            <label><strong>✨ 특수 조건</strong></label>
                             <div class="grid-2">
                                <div class="form-group">
                                    <div class="checkbox-group">
                                        <input type="checkbox" id="pet-ok" name="pet_ok">
                                        <label for="pet-ok">🐶 애완(반려동물) 가능만 보기</label>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="kw-search">특이사항 포함 키워드</label>
                                    <input type="text" id="kw-search" name="kw_search" placeholder="예: 전입, 풀옵션, 주차">
                                </div>
                            </div>

                            <button type="submit" class="button-primary full-width">🔍 검색하기</button>
                        </form>
                    </div>
                    <div id="search-results-container" class="results-container"></div>
                </div>

                <!-- Other tabs -->
            </div>
        </main>
    </div>
    <script src="property.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
